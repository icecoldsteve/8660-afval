<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8660 AFVAL · Premium</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>:root{--bg:#EEF8FB;--surface:#fff;--ink:#18182E;--muted:#5B5B72;--line:#D3E5EB;--sea:#0F7FAA;--blue:#53C2EC;--dune:#E9C46A;--display:"Barlow Condensed",sans-serif;--body:"Lexend",sans-serif;--radius:14px;--shadow:0 4px 20px rgba(15,42,51,.08)}@media(prefers-color-scheme:dark){:root{--bg:#100F24;--surface:#1A1937;--ink:#EEF8FB;--muted:#A9AFC8;--line:#2E2D57}}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}.wrap{max-width:960px;margin:auto;padding:20px}.nav{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:4px solid var(--blue);position:sticky;top:0;z-index:10}.brand{font-family:var(--display);font-size:1.6rem;font-weight:900;padding:16px 0}h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(2.4rem,6vw,3.6rem);margin:8px 0}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0;box-shadow:var(--shadow);border-top:5px solid var(--blue)}select,button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}button.primary{background:var(--sea);color:#fff;border:none}#map{height:320px;border-radius:12px;margin-top:12px}</style></head><body><div class="nav"><div class="wrap"><div class="brand">8660 AFVAL</div></div></div><div class="wrap"><h1>Afval Premium</h1><p>Zone-kalender, Drop&Go-kaart en sorteerquiz.</p><div class="card"><label>Zone: </label><select id="zone"><option value="1">Zone 1</option><option value="2">Zone 2 (Adinkerke)</option><option value="3">Zone 3</option><option value="4">Zone 4</option></select><p id="next">Selecteer voor volgende ophaaldag (2026-patroon offline).</p></div><div class="card"><h2>Drop&Go kaart</h2><div id="map"></div><p>24/7. Restafval €0,20/kg.</p></div><div class="card"><h2>Sorteerquiz</h2><p>Mag dit in GFT? <button class="primary" onclick="alert('Ja: groenten, fruit, tuinafval. Nee: restafval of PMD.')">Test</button></p></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([51.1,2.59],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);L.marker([51.098,2.592]).addTo(map).bindPopup('Sorteerpunt voorbeeld');document.getElementById('zone').onchange=e=>document.getElementById('next').textContent='Zone '+e.target.value+': check PDF of typisch wisselend rest/GFT.';</script></body></html>
